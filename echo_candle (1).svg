<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="flameCore" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#fff8e7;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#f5d780;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="flameOuter" cx="50%" cy="55%" r="55%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.6" />
      <stop offset="60%" style="stop-color:#b8860b;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#8b6914;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4a853;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4a853;stop-opacity:0" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="30" r="28" fill="url(#glow)">
    <animate attributeName="r" values="26;30;26" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>
  <ellipse cx="32" cy="32" rx="14" ry="20" fill="url(#flameOuter)">
    <animate attributeName="rx" values="13;15;13" dur="3s" repeatCount="indefinite" />
    <animate attributeName="ry" values="19;21;19" dur="3s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="32" cy="34" rx="9" ry="15" fill="url(#flameCore)">
    <animate attributeName="rx" values="8;10;8" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="ry" values="14;16;14" dur="2.5s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="32" cy="38" rx="4" ry="7" fill="#fff8e7" opacity="0.9">
    <animate attributeName="ry" values="6;8;6" dur="2s" repeatCount="indefinite" />
  </ellipse>
  <rect x="22" y="52" width="20" height="4" rx="2" fill="#8b6914" opacity="0.7" />
  <rect x="26" y="48" width="12" height="6" rx="1" fill="#a07828" opacity="0.6" />
</svg>